name: Arc Science development
on:
  push:
    paths: ['apps/arc-science/**', '.github/workflows/arc-science.yml']
  pull_request:
    paths: ['apps/arc-science/**', '.github/workflows/arc-science.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/arc-science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/arc-science/web/package-lock.json
      - run: python -m pip install '.[test]'
      - run: npm ci
        working-directory: apps/arc-science/web
      - run: npm test
        working-directory: apps/arc-science/web
      - run: npm run build
        working-directory: apps/arc-science/web
      - run: python -m pytest -q -rs
      # End-to-end: the real service on an isolated data directory driven by Playwright.
      # No Rust worker is built here, so the memory recall spec reports itself skipped.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/arc-science/web
      - run: npm run e2e:only
        working-directory: apps/arc-science/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/arc-science/web/e2e-report
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/check-wheel.py dist/arc_science-0.6.0-py3-none-any.whl
      # Native Blender tests explicitly skip without an operator-supplied runtime.
      # Ordinary CI makes no live-model, paid-service or Blender calls.
