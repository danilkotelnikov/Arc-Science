name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Node suite (syntax, kit, all six plugins, benchmarks, privacy self-test)
        run: npm test
      - name: Rust native validators
        run: cargo test --manifest-path native/arc-validators/Cargo.toml
      - name: Go gateway (arc-gateway)
        working-directory: native/arc-gateway
        run: go vet ./... && go test ./...
      - name: Privacy scan, generic patterns
        run: node scripts/privacy-scan.mjs
