name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Syntax of every .mjs and .cjs file
        run: node scripts/check-syntax.mjs
      - name: Rename map self-check
        run: node lib/arcnames.mjs
      - name: Colour recolor tests
        run: node test/iconcolor.test.mjs
      - name: Harness of Harness plugin tests
        run: node --test plugins/arc-hoh/test/hoh.test.mjs
      - name: Theme plugin tests
        run: node --test plugins/arc-theme/test/theme.test.mjs
      - name: Privacy scan self-test
        run: node scripts/privacy-scan.mjs --self-test
      - name: Privacy scan, generic patterns
        run: node scripts/privacy-scan.mjs
