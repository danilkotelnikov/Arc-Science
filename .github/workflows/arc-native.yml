name: Arc Science native supervisor
on:
  push:
    paths: ['native/arc-science/**', 'apps/arc-science/scripts/check-native-installed.py', 'apps/arc-science/src/arc_science/__main__.py', 'apps/arc-science/src/arc_science/bioart/**', 'apps/arc-science/src/arc_science/figure_render.py', 'apps/arc-science/src/arc_science/vector_assets.py', 'apps/arc-science/tests/test_module_entrypoint.py', 'apps/arc-science/tests/test_native_bioart.py', 'apps/arc-science/tests/test_render_lifetime.py', 'apps/arc-science/tests/fixtures/bioart/entry-18-reduced.json', 'apps/arc-science/tests/fixtures/render_lifetime.py', '.github/workflows/arc-native.yml']
  pull_request:
    paths: ['native/arc-science/**', 'apps/arc-science/scripts/check-native-installed.py', 'apps/arc-science/src/arc_science/__main__.py', 'apps/arc-science/src/arc_science/bioart/**', 'apps/arc-science/src/arc_science/figure_render.py', 'apps/arc-science/src/arc_science/vector_assets.py', 'apps/arc-science/tests/test_module_entrypoint.py', 'apps/arc-science/tests/test_native_bioart.py', 'apps/arc-science/tests/test_render_lifetime.py', 'apps/arc-science/tests/fixtures/bioart/entry-18-reduced.json', 'apps/arc-science/tests/fixtures/render_lifetime.py', '.github/workflows/arc-native.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/arc-science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --release --locked
      # This matrix qualifies only the native supervisor/stdlib test fixture.
      # Windows BioArt is unsupported; Linux process-tree tests use sole-writer
      # FIFO readiness/EOF, not /proc absence. Native reaps its direct child;
      # orphan grandchildren are reaped by their OS adopter. Matrix configuration
      # is not evidence of successful Windows/macOS execution. Real renderer-
      # executor lifecycle integration lives in the application pytest suite.
      # No scientific-worker, live-network, Blender, or GUI qualification here.
  module-entrypoint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/arc-science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[vector]' pytest
      # Linux-only native → real executor coverage uses the application's
      # existing dependencies, but its renderer is strictly a stdlib fixture.
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 build --locked --manifest-path ../../native/arc-science/Cargo.toml
      - run: test -x ../../native/arc-science/target/debug/arc-science-native
      - run: python -m pytest tests/test_module_entrypoint.py tests/test_render_lifetime.py tests/test_native_bioart.py -q -rs
