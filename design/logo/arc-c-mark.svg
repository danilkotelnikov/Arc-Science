<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Arc C: arch monogram</title>
  <desc>Parabolic arch read as an A; its crossbar is a single point.</desc>
  <g id="mark" fill="none" stroke="currentColor" stroke-width="112" stroke-linecap="round">
    <path id="arch" d="M 212 800 Q 512 -352 812 800"/>
    <circle id="crossbar" cx="512" cy="630" r="72" fill="currentColor" stroke="none"/>
  </g>
</svg>
