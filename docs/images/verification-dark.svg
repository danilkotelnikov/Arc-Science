<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="Arc Harness Independent Verification Loop (Dark)">
  <rect x="0.5" y="0.5" width="959" height="279" rx="14" fill="#171614" stroke="#332f2a" stroke-width="1"/>
  <text x="32" y="36" fill="#faf9f6" font-family="Geist, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" font-weight="600">Independent Verification Loop</text>
  <text x="32" y="55" fill="#a8a196" font-family="Geist, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">The builder never grades its own candidate. Every stage writes an immutable SHA-256 ledger row.</text>
  <line x1="32" y1="68" x2="928" y2="68" stroke="#2c2924" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="32" y="88" width="194" height="156" rx="10" fill="#211f1c" stroke="#3a352f" stroke-width="1.2"/>
  <text x="46" y="110" fill="#c8a98a" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">01  PROPOSE</text>
  <text x="46" y="132" fill="#faf9f6" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">Hypothesis + Boundary</text>
  <text x="46" y="154" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">Builder records exact</text>
  <text x="46" y="170" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">checks, edge probes, and</text>
  <text x="46" y="186" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">untouched file boundaries.</text>
  <rect x="46" y="204" width="166" height="24" rx="5" fill="#292622"/>
  <text x="56" y="220" fill="#d8c3aa" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5">hoh_propose()</text>

  <line x1="226" y1="166" x2="262" y2="166" stroke="#c8a98a" stroke-width="1.5"/>
  <polygon points="262,166 254,162 254,170" fill="#c8a98a"/>

  <!-- Step 2 -->
  <rect x="264" y="88" width="194" height="156" rx="10" fill="#211f1c" stroke="#3a352f" stroke-width="1.2"/>
  <text x="278" y="110" fill="#c8a98a" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">02  FREEZE</text>
  <text x="278" y="132" fill="#faf9f6" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">SHA-256 Digest Lock</text>
  <text x="278" y="154" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">Candidate files are hashed</text>
  <text x="278" y="170" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">into the ledger. Any edit</text>
  <text x="278" y="186" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">invalidates the freeze.</text>
  <rect x="278" y="204" width="166" height="24" rx="5" fill="#292622"/>
  <text x="288" y="220" fill="#d8c3aa" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5">hoh_freeze()</text>

  <line x1="458" y1="166" x2="494" y2="166" stroke="#c8a98a" stroke-width="1.5"/>
  <polygon points="494,166 486,162 486,170" fill="#c8a98a"/>

  <!-- Step 3 -->
  <rect x="496" y="88" width="194" height="156" rx="10" fill="#211f1c" stroke="#c8a98a" stroke-width="1.4"/>
  <text x="510" y="110" fill="#c8a98a" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">03  CROSS-CHECK</text>
  <text x="510" y="132" fill="#faf9f6" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">Independent Reviewer</text>
  <text x="510" y="154" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">A separate model family</text>
  <text x="510" y="170" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">runs every check, probe,</text>
  <text x="510" y="186" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">and held-out replay case.</text>
  <rect x="510" y="204" width="166" height="24" rx="5" fill="#292622"/>
  <text x="520" y="220" fill="#d8c3aa" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5">hoh_gate()</text>

  <line x1="690" y1="166" x2="726" y2="166" stroke="#c8a98a" stroke-width="1.5"/>
  <polygon points="726,166 718,162 718,170" fill="#c8a98a"/>

  <!-- Step 4 -->
  <rect x="728" y="88" width="200" height="156" rx="10" fill="#292622" stroke="#82bd96" stroke-width="1.4"/>
  <text x="742" y="110" fill="#82bd96" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">04  CARRY-OVER</text>
  <text x="742" y="132" fill="#faf9f6" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="600">Ledger + Cammut</text>
  <text x="742" y="154" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">Verified verdict enters the</text>
  <text x="742" y="170" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">hash chain, Trace tab, and</text>
  <text x="742" y="186" fill="#a8a196" font-family="Geist, system-ui, sans-serif" font-size="11">Platt-calibrated memory.</text>
  <rect x="742" y="204" width="172" height="24" rx="5" fill="#211f1c" stroke="#3d3831"/>
  <text x="752" y="220" fill="#82bd96" font-family="Geist Mono, ui-monospace, Consolas, monospace" font-size="10.5" font-weight="600">hoh_verify_ledger()</text>
</svg>
