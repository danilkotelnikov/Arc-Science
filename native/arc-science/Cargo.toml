[package]
name = "arc-science-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.9.7"
serde_json = "=1.0.145"
process-wrap = { version = "=9.0.0", default-features = false, features = ["std", "process-group", "job-object"] }
ctrlc = { version = "=3.5.0", features = ["termination"] }

[dev-dependencies]
tempfile = "=3.23.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.30.1", features = ["process", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
