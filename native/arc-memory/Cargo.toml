[package]
name = "arc-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "arc_memory"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zstd = "0.14.0"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
